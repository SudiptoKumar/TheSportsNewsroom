name: Import TheSportsNewsroom V1 ZIP

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Import or clean a ZIP placed in the repository root"
        required: true
        default: "import"
        type: choice
        options:
          - import
          - clean
      zip_name:
        description: "Exact V1 ZIP filename in the repository root"
        required: true
        default: "TheSportsNewsroom-v1.4.0-production-quality-batch.zip"
        type: string

permissions:
  contents: write

concurrency:
  group: import-thesportsnewsroom-v1
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Import selected V1 ZIP
        if: ${{ inputs.mode == 'import' }}
        shell: bash
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail
          if [[ ! "$ZIP_NAME" =~ ^TheSportsNewsroom-v1\.[0-9]+\.[0-9]+\.zip$ ]]; then
            echo "Invalid V1 ZIP filename: $ZIP_NAME"
            exit 1
          fi
          if [[ ! -f "$ZIP_NAME" ]]; then
            echo "ZIP not found: $ZIP_NAME"
            echo "ZIP files currently in repository root:"
            find . -maxdepth 1 -type f -name '*.zip' -printf '  %f\n' | sort || true
            exit 1
          fi

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          unzip -q "$ZIP_NAME" -d "$tmpdir"

          root="$tmpdir"
          mapfile -t dirs < <(find "$tmpdir" -mindepth 1 -maxdepth 1 -type d -print)
          mapfile -t files < <(find "$tmpdir" -mindepth 1 -maxdepth 1 -type f -print)
          if [[ "${#dirs[@]}" -eq 1 && "${#files[@]}" -eq 0 ]]; then
            root="${dirs[0]}"
          fi

          for required in \
            main.py news_state.json coverage_index.json posted_urls.txt requirements.txt README.md \
            prompts/exa_sector_discovery_v1.txt \
            prompts/exa_contents_verification_v1.txt \
            prompts/exa_hard_case_agent_v1.txt \
            prompts/cerebras_rank_v1.txt \
            prompts/cerebras_editorial_v1.txt \
            schemas/exa_agent_hard_case_v1.json \
            tests/test_v1.py \
            .github/workflows/newbot.yml \
            .github/workflows/import-zip.yml; do
            [[ -f "$root/$required" ]] || { echo "ZIP is missing required V1 file: $required"; exit 1; }
          done

          version="$(python - <<PY
          import re
          from pathlib import Path
          text = Path("$root/main.py").read_text(encoding="utf-8")
          m = re.search(r'^APP_VERSION\s*=\s*["\\\']([^"\\\']+)["\\\']', text, re.M)
          print(m.group(1) if m else "")
          PY
          )"
          [[ "$version" =~ ^1\. ]] || { echo "Imported package is not V1: $version"; exit 1; }
          echo "Importing The Sports Newsroom v$version from $ZIP_NAME"

          # Import only after the archive has passed structure/version validation.
          rsync -a --delete --exclude='.git/' --exclude='*.zip' "$root"/ ./
          rm -f -- *.zip

      - name: Clean ZIP files
        if: ${{ inputs.mode == 'clean' }}
        shell: bash
        run: rm -f -- *.zip

      - name: Verify imported V1 project
        if: ${{ inputs.mode == 'import' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile main.py tests/test_v1.py
          python -m json.tool schemas/exa_agent_hard_case_v1.json >/dev/null
          python main.py --version
          python main.py --self-test --fast
          python -m unittest discover -s tests -v

      - name: Commit imported V1 project
        if: ${{ inputs.mode == 'import' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sports News Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Import TheSportsNewsroom V1 project"
          git push
