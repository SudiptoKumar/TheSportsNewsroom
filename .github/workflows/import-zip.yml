name: Import ZIP into Repository

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Import or clean a ZIP placed in the repository root"
        required: true
        default: "import"
        type: choice
        options:
          - import
          - clean
      zip_name:
        description: "Exact ZIP filename in the repository root"
        required: true
        default: "TheSportsNewsroom-v4.1.1.zip"
        type: string

permissions:
  contents: write

concurrency:
  group: import-thesportsnewsroom
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Import selected ZIP
        if: ${{ inputs.mode == 'import' }}
        shell: bash
        env:
          ZIP_NAME: ${{ inputs.zip_name }}
        run: |
          set -euo pipefail
          if [[ ! "$ZIP_NAME" =~ ^[A-Za-z0-9._-]+\.zip$ ]]; then
            echo "Invalid ZIP filename: $ZIP_NAME"
            exit 1
          fi
          if [[ ! -f "$ZIP_NAME" ]]; then
            echo "ZIP not found: $ZIP_NAME"
            echo "ZIP files currently in repository root:"
            find . -maxdepth 1 -type f -name '*.zip' -printf '  %f\n' | sort || true
            exit 1
          fi

          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          unzip -q "$ZIP_NAME" -d "$tmpdir"

          root="$tmpdir"
          mapfile -t dirs < <(find "$tmpdir" -mindepth 1 -maxdepth 1 -type d -print)
          mapfile -t files < <(find "$tmpdir" -mindepth 1 -maxdepth 1 -type f -print)
          if [[ "${#dirs[@]}" -eq 1 && "${#files[@]}" -eq 0 ]]; then
            root="${dirs[0]}"
          fi

          for required in \
            main.py requirements.txt README.md \
            prompts/exa_daily_evergreen_v4.txt \
            prompts/exa_selected_evidence_v4.txt \
            prompts/cerebras_rank_v4.txt \
            prompts/cerebras_editorial_v4.txt \
            prompts/cerebras_duplicate_review_v4.txt \
            schemas/exa_daily_sports_games_output_schema_v1.json \
            schemas/exa_selected_evidence_v4.json \
            tests/test_v4.py \
            .github/workflows/newbot.yml \
            .github/workflows/import-zip.yml; do
            [[ -f "$root/$required" ]] || { echo "ZIP is missing required file: $required"; exit 1; }
          done

          version="$(python - <<PY
          import re
          from pathlib import Path
          text = Path("$root/main.py").read_text(encoding="utf-8")
          m = re.search(r'^APP_VERSION\s*=\s*[\"\\\']([^\"\\\']+)[\"\\\']', text, re.M)
          print(m.group(1) if m else "")
          PY
          )"
          [[ -n "$version" ]] || { echo "Could not read APP_VERSION from imported main.py"; exit 1; }
          echo "Importing The Sports Newsroom v$version from $ZIP_NAME"

          rsync -a --delete --exclude='.git/' --exclude='*.zip' "$root"/ ./
          rm -f -- *.zip

      - name: Clean ZIP files
        if: ${{ inputs.mode == 'clean' }}
        shell: bash
        run: rm -f -- *.zip

      - name: Verify imported V4 project
        if: ${{ inputs.mode == 'import' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile main.py
          python -m json.tool schemas/exa_daily_sports_games_output_schema_v1.json >/dev/null
          python -m json.tool schemas/exa_selected_evidence_v4.json >/dev/null
          python main.py --version
          python main.py --self-test --fast
          python -m unittest discover -s tests -v

      - name: Commit imported project
        if: ${{ inputs.mode == 'import' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Sports News Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "Import TheSportsNewsroom V4 project"
          git push
