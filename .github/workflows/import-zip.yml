name: Import ZIP into Repository

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Import or clean a ZIP placed in the repository root"
        required: true
        default: "import"
        type: choice
        options:
          - import
          - clean

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Import ZIP
        if: ${{ inputs.mode == 'import' }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=( *.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No ZIP found in repository root."
            exit 1
          fi
          zipfile="${zips[0]}"
          tmpdir="$(mktemp -d)"
          unzip -q "$zipfile" -d "$tmpdir"
          root="$tmpdir"
          if [ "$(find "$tmpdir" -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 1 ] && [ "$(find "$tmpdir" -mindepth 1 -maxdepth 1 -type f | wc -l)" -eq 0 ]; then
            root="$(find "$tmpdir" -mindepth 1 -maxdepth 1 -type d | head -n1)"
          fi
          rsync -a --delete --exclude='.git/' --exclude='*.zip' "$root"/ ./
          rm -f -- *.zip

      - name: Clean ZIP files
        if: ${{ inputs.mode == 'clean' }}
        shell: bash
        run: rm -f -- *.zip

      - name: Verify and test
        run: |
          python -m py_compile main.py
          python main.py --self-test --fast
          python -m unittest discover -v

      - name: Commit
        run: |
          git config user.name "Sports News Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Import TheSportsNewsroom project"
          git push
