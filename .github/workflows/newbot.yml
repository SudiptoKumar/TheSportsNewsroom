name: TheSportsNewsroom

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: the-sports-newsroom
  cancel-in-progress: false

jobs:
  run-sports-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL || 'gpt-oss-120b' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: "@TheSportsNewsroom"
      PYTHONUNBUFFERED: "1"
      MAX_DISCOVERY_POSTS_PER_DAY: "5"
      MAX_DISCOVERY_CANDIDATES: "60"
      MAX_HISTORY_CANDIDATES: "30"
      MAX_SPORT_EVENT_CANDIDATES: "70"
      DISCOVERY_COOLDOWN_HOURS: "3"
      STATE_RETENTION_DAYS: "120"
      HTTP_TIMEOUT: "20"
      POST_DELAY_SECONDS: "1.0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify repository structure
        run: |
          test -f main.py
          test -f news_state.json
          test -f posted_urls.txt
          test -f requirements.txt
          test -f .github/workflows/newbot.yml
          test -f .github/workflows/import-zip.yml
          test ! -d src
          test ! -d tests

      - name: Compile check
        run: python -m py_compile main.py

      - name: Run self-test
        run: python main.py --self-test

      - name: Run TheSportsNewsroom
        run: python main.py

      - name: Save state
        if: always()
        run: |
          git config user.name "Sports News Bot"
          git config user.email "actions@github.com"
          git add news_state.json posted_urls.txt

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update TheSportsNewsroom state"
            git push
          fi
