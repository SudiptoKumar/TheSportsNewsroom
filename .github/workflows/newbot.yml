name: TheSportsNewsroom V1

on:
  schedule:
    # Two production runs per day. GitHub Actions cron is UTC.
    # 02:15 UTC = 08:15 Asia/Dhaka, 14:15 UTC = 20:15 Asia/Dhaka.
    - cron: "15 2,14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        required: true
        default: "run"
        type: choice
        options:
          - run
          - diagnose
          - dry-run
          - self-test
      channel_override:
        description: "Optional test channel override, e.g. @MyPrivateTestChannel"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: the-sports-newsroom-v1
  cancel-in-progress: false

jobs:
  run-sports-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL || 'gpt-oss-120b' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
      TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || '@TheSportsNewsroom' }}
      BOT_MODE: ${{ inputs.mode || 'run' }}
      CHANNEL_OVERRIDE: ${{ inputs.channel_override }}
      PYTHONUNBUFFERED: "1"
      RUN_DEADLINE_SECONDS: "2100"
      HTTP_TIMEOUT: "15"
      STATE_RETENTION_DAYS: "120"
      POST_DELAY_SECONDS: "3"
      V1_SEARCH_RESULTS_PER_SECTOR: "6"
      V1_MAX_CANDIDATES_PER_SECTOR: "3"
      V1_CONTENTS_URLS_PER_STORY: "3"
      V1_AGENT_MAX_CASES: "2"
      V1_AGENT_TIMEOUT_SECONDS: "120"
      V1_SEARCH_DELAY_SECONDS: "0.15"
      V1_CONTENTS_CHARS: "9000"
      V1_RANK_MAX_CANDIDATES: "20"
      V1_RANK_MAX_TOKENS: "700"
      V1_EDITORIAL_MAX_TOKENS: "900"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify V1 repository structure
        run: |
          set -euo pipefail
          for f in \
            main.py news_state.json posted_urls.txt coverage_index.json requirements.txt README.md \
            prompts/exa_sector_discovery_v1.txt \
            prompts/exa_hard_case_agent_v1.txt \
            prompts/cerebras_rank_v1.txt \
            prompts/cerebras_editorial_v1.txt \
            schemas/exa_agent_hard_case_v1.json \
            tests/test_v1.py \
            .github/workflows/newbot.yml \
            .github/workflows/import-zip.yml; do
            test -f "$f"
          done

      - name: Compile, schema and version check
        run: |
          set -euo pipefail
          python -m py_compile main.py tests/test_v1.py
          python -m json.tool schemas/exa_agent_hard_case_v1.json >/dev/null
          python main.py --version

      - name: Validate V1 production configuration
        if: ${{ env.BOT_MODE == 'run' || env.BOT_MODE == 'dry-run' }}
        run: python main.py --validate-config

      - name: V1 offline contract and regression tests
        run: |
          set -euo pipefail
          python main.py --self-test --fast
          python -m unittest discover -s tests -v

      - name: Run TheSportsNewsroom V1
        if: ${{ env.BOT_MODE != 'self-test' }}
        run: |
          set -euo pipefail
          case "$BOT_MODE" in
            diagnose) python main.py --diagnose ;;
            dry-run)  python main.py --dry-run ;;
            run)      python main.py ;;
            *)        echo "Unknown BOT_MODE: $BOT_MODE"; exit 2 ;;
          esac

      - name: Save newsroom state
        if: always() && (env.BOT_MODE == 'run' || env.BOT_MODE == 'dry-run')
        run: |
          set -euo pipefail
          git config user.name "Sports News Bot"
          git config user.email "actions@github.com"
          git add news_state.json posted_urls.txt coverage_index.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git diff --cached --stat
          git commit -m "Update TheSportsNewsroom V1 state"
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing and retrying..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "::error::Could not push state after 4 attempts"
          exit 1
