name: The Sports Newsroom Discovery Bot

on:
  schedule:
    - cron: "0 0,4,8,12,16,20 * * *"
      timezone: "Asia/Dhaka"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: the-sports-newsroom-discovery
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: "@TheSportsNewsroom"
      CEREBRAS_MODEL: "gpt-oss-120b"
      PYTHONUNBUFFERED: "1"
      AI_MIN_INTERVAL_SECONDS: "1.75"
      AI_MAX_CALLS_PER_RUN: "18"
      HTTP_CONNECT_TIMEOUT: "6"
      HTTP_READ_TIMEOUT: "12"
      MAX_VERIFICATION_CANDIDATES: "10"
      MAX_DISCOVERY_POSTS_PER_DAY: "4"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile main.py src/sportsgames/*.py

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Offline self-test
        run: python main.py --self-test

      - name: Run production bot
        run: python main.py

      - name: Persist knowledge state
        if: success()
        run: |
          git config user.name "the-sports-newsroom-bot"
          git config user.email "actions@github.com"
          git add data/state/knowledge_state.json data/state/published_urls.txt
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update sports and games knowledge state"
            git push
          fi
