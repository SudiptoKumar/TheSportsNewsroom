name: TheSportsNewsroom V4

on:
  schedule:
    # Two production runs per day. GitHub Actions cron is UTC:
    # 02:15 UTC = 08:15 Asia/Dhaka, 14:15 UTC = 20:15 Asia/Dhaka.
    - cron: "15 2,14 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        required: true
        default: "run"
        type: choice
        options:
          - run
          - diagnose
          - dry-run
          - self-test
      channel_override:
        description: "Optional test channel override, e.g. @MyPrivateTestChannel"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: the-sports-newsroom-v4
  cancel-in-progress: false

jobs:
  run-sports-bot:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL || 'gpt-oss-120b' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
      TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL || '@TheSportsNewsroom' }}
      BOT_MODE: ${{ inputs.mode || 'run' }}
      CHANNEL_OVERRIDE: ${{ inputs.channel_override }}
      PYTHONUNBUFFERED: "1"
      RUN_DEADLINE_SECONDS: "1800"
      HTTP_TIMEOUT: "15"
      STATE_RETENTION_DAYS: "120"
      POST_DELAY_SECONDS: "3"
      V4_POST_DELAY_SECONDS: "3"
      V4_COVERAGE_RECENT_DAYS: "60"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify V4 repository structure
        run: |
          test -f main.py
          test -f news_state.json
          test -f posted_urls.txt
          test -f coverage_index.json
          test -f requirements.txt
          test -f README.md
          test -f prompts/exa_daily_evergreen_v4.txt
          test -f prompts/exa_selected_evidence_v4.txt
          test -f prompts/cerebras_rank_v4.txt
          test -f prompts/cerebras_editorial_v4.txt
          test -f prompts/cerebras_duplicate_review_v4.txt
          test -f schemas/exa_daily_sports_games_output_schema_v1.json
          test -f schemas/exa_selected_evidence_v4.json
          test -f tests/test_v4.py
          test -f .github/workflows/newbot.yml

      - name: Compile and schema check
        run: |
          python -m py_compile main.py
          python -m py_compile tests/test_v4.py
          python -m json.tool schemas/exa_daily_sports_games_output_schema_v1.json >/dev/null
          python -m json.tool schemas/exa_selected_evidence_v4.json >/dev/null
          python main.py --version

      - name: Validate production configuration
        if: ${{ env.BOT_MODE == 'run' || env.BOT_MODE == 'dry-run' }}
        run: python main.py --validate-config

      - name: Offline regression and V4 architecture tests
        run: |
          if [ "$BOT_MODE" = "self-test" ]; then
            python main.py --self-test
          else
            python main.py --self-test --fast
            python -m unittest discover -v
          fi

      - name: Run TheSportsNewsroom V4
        if: ${{ env.BOT_MODE != 'self-test' }}
        run: |
          case "$BOT_MODE" in
            diagnose) python main.py --diagnose ;;
            dry-run)  python main.py --dry-run ;;
            run)      python main.py ;;
            *)        echo "Unknown BOT_MODE: $BOT_MODE"; exit 2 ;;
          esac

      - name: Save newsroom state
        if: always()
        run: |
          git config user.name "Sports News Bot"
          git config user.email "actions@github.com"
          git add news_state.json posted_urls.txt coverage_index.json

          if git diff --cached --quiet; then
            echo "No state changes to commit."
            exit 0
          fi

          git commit -m "Update TheSportsNewsroom V4 state"
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt); rebasing and retrying..."
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            sleep 5
          done
          echo "::error::Could not push state after 4 attempts"
          exit 1
